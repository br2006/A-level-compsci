<canvas id="myChart" style="margin-bottom: 40px; margin-top: 10px;"></canvas>

<script>
    fetch('/api/cards/{{id}}')
        .then(response => response.json())
        .then(data => {
            const labels = data.map(item => {
                item.start.substring(0, 10)

                const date_object = new Date(item.start)
                const day = date_object.getDate()
                const month = date_object.toLocaleString('default', {month: 'short'})
                return `${day} ${month}`;
            }); // x-axis: date of workout

            const durations = data.map(item => item.duration); // y-axis: length
            const points = data.map(item => item.points); // difficulty/points
          //console.log(labels)

            const IDs = data.map(item => item.ID)
          //console.log(IDs)

            const data_for_hover = data.map(item => {
                const title = item.title; // gets the title of each card

                const date_object = new Date(item.start) // generates the date object

                const date = date_object.toLocaleDateString() // returns a string of the date

                // returns the 5 characters of the time, I do this to avoid the seconds column
                const time = date_object.toLocaleTimeString().substring(0,5) 

                return `"${title}" ${date} ${time}` // combines the strings into one
            })

          //console.log(data_for_hover)
            
            const ctx = document.getElementById('myChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar', 
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Duration (minutes)',
                            data: durations,
                            backgroundColor: 'rgba(161, 59, 59, 0.5)',
                            borderColor: 'rgba(161, 59, 59, 0.8)',
                            borderWidth: 1
                        },
                        {
                            label: 'Points',
                            data: points,
                            backgroundColor: 'rgba(153, 103, 255, 0.2)',
                            borderColor: 'rgba(153, 103, 255, 1)',
                            borderWidth: 1
                        } 
                    ]
                },
                options: {
                    responsive: true,
                    plugins: { 
                        tooltip: { // the handler for this function
                            callbacks: { // The data displayed when a bar is hovered over
                                beforeLabel: function(c) { // will render the string above the data
                                    const index = c.dataIndex // generates the index of the bar in question
                                    return `${data_for_hover[index]}\n` // returns the string from above
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    },
                    onClick: function(event, items) {
                        //console.log(items)
                        const i = items[0].index; // generates the index of the bar
                        const id = IDs[i]; // generates the ID of the card
                        //console.log(id)
                        window.location.href = `/chat/${id}`
                    }
                }
            });
        })
        .catch(error => console.error('Error fetching data:', error));
</script>
